function seededPlayers(club,idx){
 const seed=SEEDS[club.id]||[];
 let players=seed.map((p,i)=>({id:club.id+'-'+i,name:p[0],pos:p[1],ovr:p[2],pot:clamp(p[2]+Math.floor(Math.random()*13),p[2],99),age: i>11?19+Math.floor(Math.random()*5):23+Math.floor(Math.random()*9),value:Math.max(.8,Math.round((p[2]-55)**2/180*10)/10),wage:Math.max(.08,Math.round((p[2]-50)**2/2400*10)/10),fitness:80+Math.floor(Math.random()*21),morale:65+Math.floor(Math.random()*31),form:0,club:club.id,listed:false,apps:0,goals:0,assists:0,cleanSheets:0,injury:0}));

 while(players.length<18){let i=players.length;let rating=66+Math.floor(Math.random()*17)+(club.rating-84);players.push({id:club.id+'-'+i,name:EXTRA_NAMES[(i+idx*3)%EXTRA_NAMES.length],pos:POSITIONS[(i*3+idx)%POSITIONS.length],ovr:clamp(rating,60,88),pot:clamp(rating+Math.floor(Math.random()*15),rating,96),age:18+Math.floor(Math.random()*14),value:Math.max(.5,Math.round((rating-55)**2/180*10)/10),wage:Math.max(.05,Math.round((rating-50)**2/2400*10)/10),fitness:85+Math.floor(Math.random()*16),morale:65+Math.floor(Math.random()*31),form:0,club:club.id,listed:false,apps:0,goals:0,assists:0,cleanSheets:0,injury:0})}

}
function freshState(clubId){

 return {version:1,clubId,season:2026,week:0,players,table,fixtures,budgets:Object.fromEntries(CLUBS.map(c=>[c.id,c.budget])),wageBudgets:Object.fromEntries(CLUBS.map(c=>[c.id,c.wage])),history:[],news:['Welcome to the European Super League. Set your tactics, manage your squad and chase the title.'],transfers:[],tactics:'Balanced',formation:'4-3-3',savedAt:Date.now()};

function makeFixtures(){
 let ids=CLUBS.map(c=>c.id), arr=[];
 // Circle method round robin (9 rounds), then reverse fixtures.
 for(let leg=0;leg<2;leg++){
  let a=ids.slice();if(leg===1)a=a.slice().reverse();
  for(let r=0;r<9;r++){
   let round=[];
   for(let i=0;i<5;i++){let h=a[i],away=a[a.length-1-i];if((r+i)%2===0)[h,away]=[away,h];round.push({home:h,away,played:false,hg:null,ag:null})}
   arr.push(...round);a=[a[0],a[a.length-1],...a.slice(1,-1)];
  }
 }
 // Group by round from generated sequential batches of five
 return arr;
}

  p=(s.players[id]||[]).filter(x=>chosen.has(x.id)&&!x.injury&&x.fitness>=35);
 }
 if(!p || !p.length) p=(s.players[id]||[]).filter(x=>!x.injury&&x.fitness>=35).slice().sort((a,b)=>b.ovr-a.ovr).slice(0,11);
 let avg=p.reduce((n,x)=>n+x.ovr+(x.fitness-75)*.035+(x.morale-70)*.025+x.form*.25,0)/Math.max(1,p.length);

function positionScore(p,pos){
 if(p.pos===pos)return 12;
 const groups={GK:['GK'],CB:['CB'],LB:['LB','LWB'],RB:['RB','RWB'],LWB:['LWB','LB','LW'],RWB:['RWB','RB','RW'],DM:['DM','CM'],CM:['CM','DM','AM'],AM:['AM','CM','ST'],LW:['LW','RW','ST'],RW:['RW','LW','ST'],ST:['ST','FW','AM'],FW:['FW','ST','LW','RW']};

}
function lineupScore(p,pos){return p.ovr+positionScore(p,pos)*1.7+(p.form||0)*.7+(p.fitness-70)*.045+(p.morale-70)*.025}
function autoSelectLineup(s,id=s.clubId){

}
function ensureLineup(s,id=s.clubId){
 if(!s.lineup)s.lineup={};

function moneySpend(s,id,fee,wage){return s.budgets[id]>=fee && s.wageBudgets[id]>=wage}
function getMatchLineup(s,id){
 const slots=formationSlots(s.formation);
 let lineup;
 if(id===s.clubId){
  ensureLineup(s,id);
  lineup=s.lineup||{};
 }else{
  lineup=autoSelectLineup(s,id);
 }
 const squad=s.players[id]||[];
 const chosen=[];
 const used=new Set();
 slots.forEach(slot=>{
  const p=squad.find(x=>x.id===lineup[slot.key]&&!x.injury&&x.fitness>=35&&!used.has(x.id));
  if(p){chosen.push({player:p,slotPos:slot.pos,slotKey:slot.key});used.add(p.id)}
 });
 // Guard against incomplete/legacy lineups: fill any vacant slots with the best available player.
 slots.forEach(slot=>{
  if(chosen.some(x=>x.slotKey===slot.key))return;
  const candidates=squad.filter(p=>!used.has(p.id)&&!p.injury&&p.fitness>=35).sort((a,b)=>lineupScore(b,slot.pos)-lineupScore(a,slot.pos));
  if(candidates.length){const p=candidates[0];chosen.push({player:p,slotPos:slot.pos,slotKey:slot.key});used.add(p.id)}
 });
 return chosen.slice(0,11);
}
function simulateFixture(s,f){
 const home=teamStrength(s,f.home)+1.8, away=teamStrength(s,f.away);
 const formH=(Math.random()-.5)*5,formA=(Math.random()-.5)*5;
 const powerH=home+formH+(s.tactics==='Attacking'?.8:s.tactics==='Defensive'?-.3:0);
 const powerA=away+formA;
 const lamH=clamp(.9+(powerH-powerA)*.095,0.25,3.5),lamA=clamp(.9+(powerA-powerH)*.085,0.2,3.2);
 function goals(lam){let g=0,limit=Math.exp(-lam),p=1;do{g++;p*=Math.random()}while(p>limit&&g<7);return g-1}
 const hg=goals(lamH),ag=goals(lamA);
 f.played=true;f.hg=hg;f.ag=ag;
 [[f.home,hg,ag],[f.away,ag,hg]].forEach(([id,gf,ga])=>{let t=s.table[id];t.p++;t.gf+=gf;t.ga+=ga;if(gf>ga){t.w++;t.pts+=3}else if(gf===ga){t.d++;t.pts++}else t.l++});
 const your=[f.home,f.away].includes(s.clubId);
 const winner=hg===ag?'draw':hg>ag?f.home:f.away;
 const homeName=club(f.home).name,awayName=club(f.away).name;
 s.history.unshift({week:s.week+1,text:`${homeName} ${hg}–${ag} ${awayName}`,your:your,winner});
 // Statistics are credited to the actual XI (manager's saved XI for their club; auto-selected XI for AI clubs).
 [f.home,f.away].forEach(id=>{
  const active=getMatchLineup(s,id);
  active.forEach(({player:p})=>{
   p.apps=(Number(p.apps)||0)+1;
   p.fitness=clamp(p.fitness-(8+Math.floor(Math.random()*7)),25,100);
   p.morale=clamp(p.morale+(winner===id?3:winner==='draw'?1:-3),20,100);
   p.form=clamp(p.form+(winner===id?1:winner==='draw'?0:-1),-5,5);
  });
  const conceded= id===f.home ? f.ag : f.hg;
  if(conceded===0){
   active.forEach(({player:p,slotPos})=>{
    if(slotPos==='GK'||['CB','LB','RB','LWB','RWB'].includes(slotPos))p.cleanSheets=(Number(p.cleanSheets)||0)+1;
   });
  }
  const attackers=active.filter(x=>['ST','LW','RW','AM'].includes(x.slotPos));
  const outfield=active.filter(x=>x.slotPos!=='GK');
  for(let j=0;j<gfFor(id,f);j++){
   const pool=attackers.length?attackers:outfield;
   if(!pool.length)continue;
   const scorer=pool[Math.floor(Math.random()*pool.length)];
   scorer.player.goals=(Number(scorer.player.goals)||0)+1;
   // Most goals receive one assist; the remainder are unassisted. A scorer cannot assist their own goal.
   if(Math.random()<0.68){
    const helpers=active.filter(x=>x.player.id!==scorer.player.id);
    if(helpers.length){const helper=helpers[Math.floor(Math.random()*helpers.length)];helper.player.assists=(Number(helper.player.assists)||0)+1;}
   }
  }
  const squad=s.players[id]||[];
  squad.forEach(p=>{if(p.injury>0)p.injury--;else if(Math.random()<.012)p.injury=1+Math.floor(Math.random()*3)});
 });
 const yourId=s.clubId;
 if(your){const gf=f.home===yourId?hg:ag,ga=f.home===yourId?ag:hg;let msg=gf>ga?`Victory: ${homeName} ${hg}–${ag} ${awayName}.`:gf===ga?`Draw: ${homeName} ${hg}–${ag} ${awayName}.`:`Defeat: ${homeName} ${hg}–${ag} ${awayName}.`;s.news.unshift(msg)}
 return f;
}
function gfFor(id,f){return f.home===id?f.hg:f.ag}
function sortTable(s){return CLUBS.slice().sort((a,b)=>{let x=s.table[a.id],y=s.table[b.id];return y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf})}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){let old=document.querySelector('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2400)}

function clubPage(me,rank){
 let squad=state.players[state.clubId],avg=Math.round(squad.reduce((a,p)=>a+p.ovr,0)/squad.length),wage=squad.reduce((a,p)=>a+p.wage,0);
 return `<div class="panel"><div class="panelhead"><div><div class="brand">Club office</div><h2>${me.emoji} ${me.name}</h2><div class="sub">Shape your identity and manage your resources</div></div></div><div class="stats"><div class="stat"><div class="label">Squad rating</div><div class="value">${avg}</div><div class="hint">Average player OVR</div></div><div class="stat"><div class="label">Reputation</div><div class="value">${me.rep}</div><div class="hint">Club prestige</div></div><div class="stat"><div class="label">Weekly wages</div><div class="value">${money(wage)}</div><div class="hint">Approximate squad cost</div></div><div class="stat"><div class="label">League rank</div><div class="value">#${rank}</div><div class="hint">Current position</div></div></div><h3>Team tactics</h3><p class="muted small">Tactics influence match simulation. Attacking adds attacking output but can increase risk; defensive reduces your attacking output slightly.</p><div class="grid2"><div><label class="small muted">Tactical approach</label><select id="tacticSelect" class="select"><option ${state.tactics==='Balanced'?'selected':''}>Balanced</option><option ${state.tactics==='Attacking'?'selected':''}>Attacking</option><option ${state.tactics==='Defensive'?'selected':''}>Defensive</option></select></div><div><label class="small muted">Formation</label><select id="formationSelect" class="select">${Object.keys(FORMATIONS).map(f=>`<option ${state.formation===f?'selected':''}>${f}</option>`).join('')}</select><p class="muted small">Edit the actual starting XI in the Squad tab.</p></div></div><div class="actions" style="margin-top:14px"><button id="saveOffice">Save settings</button><button class="secondary" id="exportSave">Export save JSON</button><label class="secondary" style="padding:11px 14px;border-radius:12px;cursor:pointer;font-weight:750">Import save JSON<input type="file" id="importSave" accept=".json,application/json" hidden></label></div><div class="panel" style="margin:18px 0 0;background:#10182a"><h3>Prototype roadmap</h3><div class="list"><div class="rowitem"><div><div class="name">Current: player season statistics</div><div class="meta">Appearances, goals, assists, clean sheets and save-compatible player records.</div></div><span class="tag good">v0.2</span></div><div class="rowitem"><div><div class="name">Next: player development</div><div class="meta">Controlled rating progression and regression based on age, potential and playing time.</div></div><span class="tag warn">Planned</span></div><div class="rowitem"><div><div class="name">Later: long-term management</div><div class="meta">Season rollover, improved negotiations and AI club transfer activity.</div></div><span class="tag">Future</span></div></div></div></div>`;
}
function showModal(content){let b=document.createElement('div');b.className='modalback';b.id='modalBack';b.innerHTML=`<div class="modal">${content}</div>`;document.body.append(b);b.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>b.remove());b.onclick=e=>{if(e.target===b)b.remove()};}
function playerModal(p){
 const own=p.club===state.clubId;
 let content=`<div class="panelhead"><div><div class="brand">${own?'Your player':'Transfer target'}</div><h2>${esc(p.name)}</h2><div class="sub">${p.pos} · Age ${p.age} · ${own?club(state.clubId).name:club(p.club).name}</div></div><span class="tag">${p.ovr} OVR</span></div><div class="stats"><div class="stat"><div class="label">Potential</div><div class="value">${p.pot}</div></div><div class="stat"><div class="label">Value</div><div class="value">${money(p.value)}</div></div><div class="stat"><div class="label">Fitness</div><div class="value">${p.fitness}%</div></div><div class="stat"><div class="label">Morale</div><div class="value">${p.morale}</div></div></div><div class="list"><div class="rowitem"><span>Weekly wage</span><b>${money(p.wage)}</b></div><div class="rowitem"><span>Contract status</span><b>${p.age<22?'Young prospect':'Under contract'}</b></div><div class="rowitem"><span>Season appearances</span><b>${Number(p.apps)||0}</b></div><div class="rowitem"><span>Goals</span><b>${Number(p.goals)||0}</b></div><div class="rowitem"><span>Assists</span><b>${Number(p.assists)||0}</b></div><div class="rowitem"><span>Clean sheets</span><b>${Number(p.cleanSheets)||0}</b></div></div>`;
 if(own)content+=`<div class="modalfoot"><button class="secondary" data-close>Close</button><button id="toggleListed" class="secondary">${p.listed?'Remove from transfer list':'List for transfer'}</button></div>`;
 else content+=`<div class="modalfoot"><button class="secondary" data-close>Cancel</button><button id="offerPlayer">Negotiate transfer</button></div>`;
 showModal(content);
 document.getElementById('toggleListed')?.addEventListener('click',()=>{p.listed=!p.listed;save();document.getElementById('modalBack').remove();render();toast(p.listed?'Player listed for transfer':'Player removed from transfer list')});
 document.getElementById('offerPlayer')?.addEventListener('click',()=>{document.getElementById('modalBack').remove();offerModal(p)});
}
function offerModal(p){
 const seller=club(p.club),minimum=Math.max(p.value*.72,1),max=Math.max(p.value*1.8,minimum+1);
 showModal(`<div class="brand">Transfer negotiation</div><h2>Offer for ${esc(p.name)}</h2><p class="muted">Selling club: ${seller.name}. Estimated value: ${money(p.value)}. The club may reject offers for key players, low fees or squad depth.</p><label class="small muted">Transfer fee (€m)</label><input id="offerFee" type="number" min="0.1" step="0.5" value="${Math.ceil(p.value*1.05*2)/2}" class="select" style="margin-top:6px"><label class="small muted" style="display:block;margin-top:12px">Proposed weekly wage (€m)</label><input id="offerWage" type="number" min="0.01" step="0.05" value="${Math.ceil(p.wage*1.15*20)/20}" class="select" style="margin-top:6px"><div class="modalfoot"><button class="secondary" data-close>Cancel</button><button id="submitOffer">Submit offer</button></div>`);
 document.getElementById('submitOffer').onclick=()=>{
  let fee=Number(document.getElementById('offerFee').value),wage=Number(document.getElementById('offerWage').value);
  if(!Number.isFinite(fee)||!Number.isFinite(wage)||fee<=0||wage<=0){toast('Enter a valid fee and wage');return}
  if(!moneySpend(state,state.clubId,fee,wage)){toast('Not enough transfer or wage budget');return}
  let sellerSquad=state.players[p.club],sellerStrength=teamStrength(state,p.club),isKey=p.ovr>=sellerStrength-1;
  let acceptChance=.36+(fee/p.value-1)*.28+(sellerSquad.filter(x=>x.pos===p.pos).length>2?.10:0)+(club(state.clubId).rep-seller.rep)*.012-(isKey?.15:0);
  acceptChance=clamp(acceptChance,.05,.9);
  let response, accepted=Math.random()<acceptChance && fee>=minimum;
  if(fee<p.value*.78){response=`${seller.name} rejected the offer. They consider €${fee.toFixed(1)}m too low for ${p.name}.`;state.news.unshift(response);document.getElementById('modalBack').remove();toast('Offer rejected');save();render();return}
  if(!accepted){
   let counter=Math.ceil(Math.max(p.value*1.12,fee*1.15)*2)/2;
   response=`${seller.name} rejected the offer and indicated they would consider around ${money(counter)}.`;
   state.news.unshift(response);state.transfers.unshift({player:p.name,from:seller.name,to:club(state.clubId).name,fee,status:'Rejected / countered'});
   document.getElementById('modalBack').remove();save();render();showModal(`<h2>Offer rejected</h2><p>${esc(response)}</p><p class="muted">Try a higher fee or revisit later. Transfer decisions are simplified in this early version.</p><div class="modalfoot"><button data-close>Close</button></div>`);return;
  }
  if(wage<p.wage*.85){response=`${p.name} rejected the contract because the proposed wage is below expectations.`;state.news.unshift(response);document.getElementById('modalBack').remove();save();render();showModal(`<h2>Player rejected contract</h2><p>${esc(response)}</p><div class="modalfoot"><button data-close>Close</button></div>`);return}
  state.budgets[state.clubId]-=fee;state.wageBudgets[state.clubId]-=wage;
  state.players[p.club]=state.players[p.club].filter(x=>x.id!==p.id);
  p.club=state.clubId;p.wage=wage;p.listed=false;p.morale=clamp(p.morale+5,0,100);state.players[state.clubId].push(p);
  response=`Signed ${p.name} from ${seller.name} for ${money(fee)}.`;
  state.news.unshift(response);state.transfers.unshift({player:p.name,from:seller.name,to:club(state.clubId).name,fee,status:'Completed'});
  document.getElementById('modalBack').remove();save();render();showModal(`<h2>Transfer completed!</h2><p>${esc(response)}</p><p class="muted">The transfer fee and wage room have been deducted from your budgets.</p><div class="modalfoot"><button data-close>Continue</button></div>`);
 };
}
function generateAIBids(){
 state.incomingBids=state.incomingBids||[];
 const listed=(state.players[state.clubId]||[]).filter(p=>p.listed);
 for(const p of listed){
  if(state.incomingBids.some(b=>b.playerId===p.id&&b.status==='Pending')) continue;
  // One plausible chance per listed player per matchweek; stronger players attract more interest.
  const chance=clamp(.22+(p.ovr-75)*.012, .12, .48);
  if(Math.random()>chance) continue;
  const buyers=CLUBS.filter(c=>c.id!==state.clubId && (state.players[c.id]||[]).length<30 && state.budgets[c.id]>=p.value*.65);
  if(!buyers.length) continue;
  const buyer=buyers[Math.floor(Math.random()*buyers.length)];
  const fee=Math.round(p.value*(.78+Math.random()*.42)*2)/2;
  const bid={id:'bid-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),playerId:p.id,from:buyer.id,fee,status:'Pending',week:state.week+1};
  state.incomingBids.unshift(bid);
  state.news.unshift(`${buyer.name} submitted a ${money(fee)} bid for transfer-listed ${p.name}.`);
 }
}
function resolveAIBid(id,accept){
 const bid=(state.incomingBids||[]).find(b=>b.id===id&&b.status==='Pending');
 if(!bid)return;
 const p=(state.players[state.clubId]||[]).find(x=>x.id===bid.playerId);
 if(!p){bid.status='Withdrawn';save();render();return}
 if(!accept){bid.status='Rejected';state.news.unshift(`You rejected ${club(bid.from).name}'s bid for ${p.name}.`);save();render();toast('Bid rejected');return}
 bid.status='Accepted';
 state.players[state.clubId]=state.players[state.clubId].filter(x=>x.id!==p.id);
 p.club=bid.from;p.listed=false;
 state.players[bid.from]=state.players[bid.from]||[];
 state.players[bid.from].push(p);
 state.budgets[bid.from]=Math.max(0,(state.budgets[bid.from]||0)-bid.fee);
 state.budgets[state.clubId]=(state.budgets[state.clubId]||0)+bid.fee;
 state.news.unshift(`${p.name} sold to ${club(bid.from).name} for ${money(bid.fee)}.`);
 state.transfers.unshift({player:p.name,from:club(state.clubId).name,to:club(bid.from).name,fee:bid.fee,status:'Completed — AI bid'});
 save();render();toast('Transfer completed');
}
function advanceWeek(){
 if(state.week>=18){toast('Season is complete');return}
 let rounds=getRounds(state),round=rounds[state.week];round.forEach(f=>simulateFixture(state,f));
 state.week++;
 // recover a little between matchweeks
 Object.values(state.players).flat().forEach(p=>{p.fitness=clamp(p.fitness+8,20,100);p.morale=clamp(p.morale+1,15,100)});
 ensureLineup(state);
 generateAIBids();
 if(state.week===18){let champion=sortTable(state)[0];state.news.unshift(`Season ${state.season} complete: ${champion.name} are champions with ${state.table[champion.id].pts} points.`)}
 save();render();toast(state.week===18?'Season complete!':'Matchweek simulated');
}
document.addEventListener('click',e=>{
 const pageBtn=e.target.closest('[data-page]');if(pageBtn){page=pageBtn.dataset.page;render();return}
 const acceptBid=e.target.closest('[data-bid-accept]');if(acceptBid){resolveAIBid(acceptBid.dataset.bidAccept,true);return}
 const rejectBid=e.target.closest('[data-bid-reject]');if(rejectBid){resolveAIBid(rejectBid.dataset.bidReject,false);return}
 if(e.target.id==='autoLineup'){state.lineup=autoSelectLineup(state);ensureLineup(state);save();render();toast('Best XI selected');return}
 if(e.target.id==='saveLineup'){ensureLineup(state);save();render();toast('Lineup saved');return}
 const playerBtn=e.target.closest('[data-player]');if(playerBtn){let p=Object.values(state.players).flat().find(x=>x.id===playerBtn.dataset.player);if(p)playerModal(p);return}
 const buyBtn=e.target.closest('[data-buy]');if(buyBtn){let p=Object.values(state.players).flat().find(x=>x.id===buyBtn.dataset.buy);if(p)playerModal(p);return}
 if(e.target.id==='playMatch'){advanceWeek();return}
 if(e.target.id==='confirmNew'){document.getElementById('modalBack')?.remove();state=null;clubSelectScreen();return}
 if(e.target.id==='saveOffice'){state.tactics=document.getElementById('tacticSelect').value;const nextFormation=document.getElementById('formationSelect').value;if(nextFormation!==state.formation){state.formation=nextFormation;state.lineup=autoSelectLineup(state)}save();toast('Club settings saved');return}
 if(e.target.id==='exportSave'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='european-super-league-career.json';a.click();URL.revokeObjectURL(url);toast('Save exported');return}
});
document.addEventListener('change',e=>{
 if(e.target.id==='positionFilter'||e.target.id==='squadSort'){render();return}
 if(e.target.id==='lineupFormation'){
  const next=e.target.value;
  if(next!==state.formation){state.formation=next;state.lineup=autoSelectLineup(state);ensureLineup(state);save();render();toast('Formation updated');}
  return;
 }
 const slot=e.target.closest('[data-slot]');
 if(slot){
  const key=slot.dataset.slot, pid=slot.value;
  state.lineup=state.lineup||{};
  if(pid && Object.entries(state.lineup).some(([k,v])=>k!==key&&v===pid)){toast('A player can only occupy one position');render();return}
  if(pid)state.lineup[key]=pid;else delete state.lineup[key];
  ensureLineup(state);save();render();return;
 }
 if(e.target.id==='importSave'){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!obj.clubId||!obj.players||!obj.fixtures)throw Error('Invalid save');state=migratePlayerStats(obj);state.incomingBids=state.incomingBids||[];if(!state.formation)state.formation='4-3-3';if(!state.lineup)state.lineup=autoSelectLineup(state);ensureLineup(state);save();page='dashboard';render();toast('Career imported')}catch(err){toast('Could not import that save file')}};reader.readAsText(f)}
});
function migratePlayerStats(s){
 if(!s||!s.players)return s;
 Object.values(s.players).forEach(roster=>(roster||[]).forEach(p=>{
  p.apps=Number.isFinite(Number(p.apps))?Number(p.apps):0;
  p.goals=Number.isFinite(Number(p.goals))?Number(p.goals):0;
  p.assists=Number.isFinite(Number(p.assists))?Number(p.assists):0;
  p.cleanSheets=Number.isFinite(Number(p.cleanSheets))?Number(p.cleanSheets):0;
 }));
 return s;
}
window.addEventListener('beforeunload',save);
const existing=loadSaved();if(existing){state=migratePlayerStats(existing);if(!state.formation)state.formation='4-3-3';if(!state.lineup)state.lineup=autoSelectLineup(state);if(!state.incomingBids)state.incomingBids=[];ensureLineup(state);save();render()}else clubSelectScreen();
</script>
